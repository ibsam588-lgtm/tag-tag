<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tag Tag: Playground Blitz</title>
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%2336d6ff"/><circle cx="23" cy="34" r="13" fill="%23ff3f68"/><circle cx="41" cy="27" r="10" fill="%23ffd447"/><path d="M11 51h42" stroke="%23fff7df" stroke-width="6" stroke-linecap="round"/></svg>' />
  </head>
  <body>
    <div id="app">
      <main id="game-shell" aria-label="Tag Tag Playground Blitz">
        <div id="game-root"></div>

        <section id="hud" class="hud hud-hidden" aria-live="polite">
          <div class="hud-top">
            <div class="hud-chip timer-chip">
              <span class="hud-label">Time</span>
              <strong id="timer-text">01:30</strong>
            </div>
            <div class="hud-chip it-chip">
              <span class="it-dot"></span>
              <span class="hud-label">It</span>
              <strong id="it-text">Coach</strong>
            </div>
            <div class="hud-chip score-chip">
              <span class="hud-label">Score</span>
              <strong id="score-text">0</strong>
            </div>
          </div>

          <div class="hud-left">
            <div class="meter-panel">
              <div class="meter-row">
                <span>Stamina</span>
                <strong id="stamina-value">100</strong>
              </div>
              <div class="meter-track">
                <div id="stamina-fill" class="meter-fill"></div>
              </div>
            </div>
            <div class="objective-chip" id="objective-text">Bell Zone in 05</div>
            <div class="objective-chip yard-chip" id="yard-text">Yard Open</div>
          </div>

          <div class="hud-bottom">
            <div id="joystick" class="joystick" aria-label="Move">
              <div id="joystick-stick" class="joystick-stick"></div>
            </div>
            <div class="ability-cluster">
              <button id="dash-button" class="ability-button" type="button">
                <span>Dash</span>
                <small id="dash-cooldown">Ready</small>
              </button>
              <button id="fake-button" class="ability-button" type="button">
                <span>Fake-Out</span>
                <small id="fake-cooldown">Ready</small>
              </button>
            </div>
          </div>
        </section>

        <section id="menu-screen" class="menu-screen">
          <div class="brand-lockup">
            <p>Tag Tag</p>
            <h1>Playground Blitz</h1>
          </div>

          <div class="menu-grid">
            <form id="setup-form" class="panel setup-panel">
              <div>
                <span class="panel-kicker">Round Setup</span>
                <h2>Start a chase that cannot stall</h2>
              </div>

              <label>
                Player name
                <input id="player-name" name="playerName" type="text" maxlength="16" value="Ibsam" autocomplete="given-name" />
              </label>

              <label>
                Bot players
                <input id="bot-count" name="botCount" type="range" min="3" max="7" value="5" />
                <span id="bot-count-value" class="range-value">5 bots</span>
              </label>

              <label>
                Round length
                <select id="round-length" name="roundLength">
                  <option value="60">60 seconds</option>
                  <option value="90" selected>90 seconds</option>
                  <option value="120">120 seconds</option>
                </select>
              </label>

              <fieldset>
                <legend>Tempo</legend>
                <label class="radio-card">
                  <input type="radio" name="difficulty" value="chill" />
                  <span>Chill</span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="difficulty" value="balanced" checked />
                  <span>Balanced</span>
                </label>
                <label class="radio-card">
                  <input type="radio" name="difficulty" value="blitz" />
                  <span>Blitz</span>
                </label>
              </fieldset>

              <button class="primary-button" type="submit">Play</button>
            </form>

            <form id="feedback-form" class="panel feedback-panel">
              <div>
                <span class="panel-kicker">Idea Form</span>
                <h2>Next playground tweak</h2>
              </div>
              <label>
                Feature idea
                <textarea id="idea-text" name="idea" rows="4" placeholder="Example: add chalk smoke, trampolines, or team mode"></textarea>
              </label>
              <button class="secondary-button" type="submit">Save idea</button>
              <p id="idea-status" class="status-line">Saved ideas stay in this browser.</p>
            </form>
          </div>
        </section>

        <section id="results-modal" class="results-modal hidden">
          <div class="panel results-panel">
            <span class="panel-kicker">Round Complete</span>
            <h2 id="winner-text">Winner</h2>
            <p id="results-text"></p>
            <button id="play-again-button" class="primary-button" type="button">Play again</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
